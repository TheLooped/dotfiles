"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

# vim:fileencoding=utf-8:foldmethod=marker

# : Flavor {{{

[flavor]
#use = "cosmos"

# : }}}

# : }}}


# : Manager {{{

[manager]
cwd = { fg = "#a1f6ff", bold = true }

# Hovered
hovered = { bg = "#23292e" }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#ffbe69", bold = true, italic = true, underline = true }
find_position = { fg = "#B39ad3", bg = "#637381", bold = true, italic = true }

# Marker
marker_copied = { fg = "#74d899", bg = "#74d899" }
marker_cut = { fg = "#ff5c5c", bg = "#ff5c5c" }
marker_marked = { fg = "#8799e8", bg = "#8799e8" }
marker_selected = { fg = "#ff9aee", bg = "#ff9aee" }

# Tab
tab_active = { fg = "#a1f6ff" }
tab_inactive = { fg = "#23292e" }
tab_width = 1

# Count
count_copied = { bg = "#0a1219", fg = "#74d899" }
count_cut = { bg = "#0a1219", fg = "#ff5c5c" }
count_selected = { bg = "#0a1219", fg = "#ffbe69" }

# Border
border_symbol = "│"
border_style = { fg = "#a1f6ff" }

# Highlighting
syntect_theme = ""

# : }}}


# : Status {{{

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#23292e", bg = "#23292e" }

# Mode
mode_normal = { fg = "#0a1219", bg = "#8799e8", bold = true }
mode_select = { fg = "#0a1219", bg = "#f46363", bold = true }
mode_unset = { fg = "#0a1219", bg = "#ff8547", bold = true }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#8799e8", bg = "#0a1219" }
progress_error = { fg = "#f46363", bg = "#0a1219" }

# Permissions
permissions_t = { fg = "#4ce47e" }
permissions_r = { fg = "#ffd147" }
permissions_w = { fg = "#f46363" }
permissions_x = { fg = "#a1f6ff" }
permissions_s = { fg = "#23292e" }

# : }}}


# : Select {{{

[select]
border = { fg = "#a1f6ff" }
active = { fg = "#ffadf1", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border = { fg = "#ffadf1" }
title = { fg = "#74d899" }
value = { fg = "#c2ffff" }
selected = { bg = "#192025", fg = "#c2ffff" }


# : }}}


# : Completion {{{

[completion]
border = { fg = "#a1f6ff" }
active = { bg = "#637381", fg = "#c2ffff" }
inactive = {}

# Icons
icon_file = ""
icon_folder = ""
icon_command = ""

# : }}}


# : Tasks {{{

[tasks]
border = { fg = "#a1f6ff" }
title = {}
hovered = { fg = "#ff9aee", underline = true }

# : }}}


# : Which {{{

[which]
cols = 2
mask = { bg = "#0a1219" }
cand = { fg = "#e0e7f9", bold = true, italic = true }
rest = { fg = "#23292e" }
desc = { fg = "#ffadf1" }
separator = "  "
separator_style = { fg = "#a1f6ff" }

# : }}}


# : Help {{{

[help]
on = { fg = "#a1f6ff" }
run = { fg = "#74d899" }
desc = { fg = "#ffadf1" }
hovered = { bg = "#192025", italic = true, bold = true }
footer = { bg = "#081017", fg = "#dfebfe" }

# : }}}


# : Notify {{{

[notify]
title_info = { fg = "#74d899" }
title_warn = { fg = "#ffbe69" }
title_error = { fg = "#ff5c5c" }

# Icons
icon_info = ""
icon_warn = ""
icon_error = ""

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#a1f6ff" },

    # Media
    { mime = "{audio,video}/*", fg = "#ffbe69" },

    # Archives
    { mime = "application/*zip", fg = "#ffadf1" },
    { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ffadf1" },

    # Documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#74d899" },

    # Fallback
    # { name = "*", fg = "white" },
    { name = "*/", fg = "#dfebfe" },
]

